name: Compile LaTeX

on:
  push:
    paths:
      - "**.tex"
      - "**.cls"
      - "**.bib"
      - ".github/workflows/latex.yml"
  pull_request:
    paths:
      - "**.tex"
      - "**.cls"
      - "**.bib"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Find .tex files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          files=$(ls *.tex | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Found: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.file }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick engine
        id: engine
        run: |
          name="$(basename "${{ matrix.file }}" .tex)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if grep -qE '\\usepackage(\[[^]]*\])?\{(ctex|xeCJK|fontspec)\}' "${{ matrix.file }}"; then
            echo "args=-pdfxe" >> "$GITHUB_OUTPUT"
          else
            echo "args=-pdf" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.file }}
          latexmk_use_xelatex: false
          args: ${{ steps.engine.outputs.args }} -file-line-error -interaction=nonstopmode

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.engine.outputs.name }}-pdf
          path: ${{ steps.engine.outputs.name }}.pdf
          if-no-files-found: error
